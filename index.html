<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#FBF5E9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1C1B18" media="(prefers-color-scheme: dark)">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>翹臀冒險</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--page:#EFE7D6;--white:#fff;--dot:#C9C2B0;--off:#EEE9DD;--dash:#E2DAC6;--good:#1D9E75;--zero:#B4AD9C;--seg:#EFE8D8;--bodyBase:#CFC6B1;--bodyOff:#F3EDE0;--onc:#2C2A26;--bg:#FBF5E9;--card:#FFFDF8;--ink:#3A3833;--sub:#7A776E;--line:#3A3833;--mint:#5DCAA5;--mint2:#1D9E75;--mintL:#E1F5EE;--butter:#FAC775;--butterL:#FDF0D5;--lav:#CECBF6;--lavL:#EEEDFE;--coral:#F0997B;--coralL:#FAECE7;--red:#E86A5C}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--page);font-family:'Noto Sans TC',system-ui,sans-serif;color:var(--ink)}
#app{max-width:430px;min-height:100vh;margin:0 auto;background:var(--bg);position:relative;padding-bottom:84px;overflow-x:hidden}
.screen{padding:18px 16px 8px;animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1{font-size:26px;font-weight:900;margin:0 0 4px;letter-spacing:1px}
h2{font-size:19px;font-weight:700;margin:0 0 10px}
h3{font-size:16px;font-weight:700;margin:0 0 6px}
p{margin:0 0 8px;line-height:1.6}
.sub{color:var(--sub);font-size:13px}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px;box-shadow:0 4px 0 var(--line);margin-bottom:14px}
.btn{font-family:inherit;font-size:16px;font-weight:700;border:2px solid var(--line);border-radius:16px;padding:12px 16px;background:var(--card);color:var(--ink);box-shadow:0 4px 0 var(--line);cursor:pointer;transition:transform .08s,box-shadow .08s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--line)}
.btn.main{background:var(--mint);width:100%;font-size:18px;padding:14px}
.btn.butter{background:var(--butter)}
.btn.lav{background:var(--lav)}
.btn.coral{background:var(--coral)}
.btn.sm{font-size:13px;padding:7px 10px;border-radius:12px;box-shadow:0 3px 0 var(--line)}
.btn.sm:active{transform:translateY(3px)}
.btn.ghost{background:transparent;box-shadow:none;border-style:dashed}
.btn[disabled]{opacity:.45}
.row{display:flex;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;border:1.5px solid var(--line)}
.bar{height:16px;border:2px solid var(--line);border-radius:99px;background:var(--white);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--butter);border-right:2px solid var(--line);transition:width .5s}
.bar.xp{height:10px}.bar.xp>i{background:var(--mint)}
input,select{font-family:inherit;font-size:16px;border:2px solid var(--line);border-radius:12px;padding:10px;background:var(--white);color:var(--ink);width:100%}
/* header */
.hud{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.hud .av{width:64px;height:64px;border-radius:16px;border:2px solid var(--line);background:var(--mintL);overflow:hidden;flex-shrink:0}
.hud .av img{width:100%;height:100%}
.flame{background:var(--butterL);border:2px solid var(--line);border-radius:14px;padding:4px 10px;font-weight:900;font-size:14px;white-space:nowrap}
/* coach bubble */
.coach{display:flex;gap:10px;align-items:flex-end;margin-bottom:14px}
.coach img{width:56px;height:56px;border-radius:50%;border:2px solid var(--line);background:#fff;flex-shrink:0}
.bubble{background:var(--white);border:2px solid var(--line);border-radius:18px 18px 18px 4px;padding:10px 12px;font-size:14px;line-height:1.5;position:relative}
.bubble b{display:block;font-size:11px;color:var(--sub);margin-bottom:2px}
/* map */
.node{display:flex;align-items:center;gap:12px;border:2px solid var(--line);border-radius:20px;padding:12px;box-shadow:0 4px 0 var(--line);cursor:pointer;margin-bottom:6px;background:var(--card)}
.node .ic{width:52px;height:52px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0}
.path{display:flex;justify-content:center;margin:2px 0 8px}
.path span{width:6px;height:6px;border-radius:50%;background:var(--dot);margin:0 3px}
.mon{position:relative;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:8px;box-shadow:0 4px 0 var(--line);cursor:pointer;text-align:left;font-family:inherit;color:var(--ink)}
.mon:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.mon .pic{background:var(--mintL);border-radius:14px;aspect-ratio:1/1;overflow:hidden;border:1.5px solid var(--line);position:relative}
.mon .pic img{width:100%;height:100%;object-fit:cover}
.mon .vil{font-size:11px;font-weight:700;margin:6px 2px 0}
.mon .nm{font-size:14px;font-weight:700;margin:0 2px 4px;line-height:1.3;min-height:36px}
.hp{display:flex;gap:3px;margin:0 2px 2px}
.hp i{flex:1;height:8px;border-radius:99px;border:1.5px solid var(--line);background:var(--red)}
.hp i.off{background:var(--off)}
.mon.dead .pic::after{content:'完成！';position:absolute;inset:0;background:rgba(93,202,165,.82);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:24px;color:#E8483B;letter-spacing:2px;text-shadow:2px 2px 0 #fff,-2px -2px 0 #fff,2px -2px 0 #fff,-2px 2px 0 #fff,0 4px 0 #3A3833}
.mon.locked{filter:grayscale(.7);opacity:.7}
.lock{position:absolute;top:8px;right:8px;background:var(--white);border:2px solid var(--line);border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-size:14px;z-index:2}
.done-badge{position:absolute;top:4px;right:4px;width:44px;height:44px;z-index:3;transform:rotate(-8deg);animation:stamp .45s cubic-bezier(.3,1.7,.5,1) both;filter:drop-shadow(0 3px 0 #3A3833)}
@keyframes stamp{0%{transform:scale(2.2) rotate(-25deg);opacity:0}60%{transform:scale(.9) rotate(-5deg);opacity:1}100%{transform:scale(1) rotate(-8deg)}}
/* exercise */
.hero{background:var(--mintL);border:2px solid var(--line);border-radius:24px;overflow:hidden;position:relative}
.hero img{width:100%;display:block}
.hero .tag{position:absolute;top:10px;left:10px}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.set{display:grid;grid-template-columns:38px 1fr 1fr 52px;gap:8px;align-items:center;padding:8px;border:2px solid var(--line);border-radius:16px;margin-bottom:8px;background:var(--white)}
.set.hit{background:var(--mintL)}
.set .no{font-weight:900;text-align:center;font-size:13px}
.set input{padding:8px;text-align:center;font-weight:700}
.set .ok{font-size:22px;text-align:center}
.tips li{margin-bottom:6px;line-height:1.5;font-size:14px}
.sugg{background:var(--butterL);border:2px solid var(--line);border-radius:16px;padding:10px 12px;margin:10px 0}
.adj{display:flex;gap:8px;margin-top:8px}
.adj .btn{flex:1}
/* nav */
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--card);border-top:2px solid var(--line);display:flex;justify-content:space-around;padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:20}
nav button{background:none;border:none;font-family:inherit;font-size:11px;font-weight:700;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:4px 8px;border-radius:14px}
nav button .ico{width:28px;height:28px;display:block;transition:transform .15s}
nav button.on .ico{transform:translateY(-2px) scale(1.08)}
nav button:not(.on) .ico{opacity:.75}
nav button.on{color:var(--ink);background:var(--butterL)}
nav{align-items:flex-end}
nav button.center{position:relative;margin-top:-26px;padding:0 6px 4px;background:none!important}
nav button.center .ico{width:40px;height:40px;padding:8px;box-sizing:content-box;border-radius:50%;background:var(--mint);border:2.5px solid var(--line);box-shadow:0 4px 0 var(--line);opacity:1!important;transform:none!important}
nav button.center.on .ico{background:var(--butter)}
nav button.center.on{color:var(--ink)}
/* overlays */
.ov{position:fixed;inset:0;background:rgba(58,56,51,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:430px;border-radius:26px 26px 0 0;border:2px solid var(--line);border-bottom:none;padding:18px 16px 26px;max-height:88vh;overflow:auto;animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.ov.center{align-items:center;padding:20px}
.ov.center .sheet{border-radius:26px;border-bottom:2px solid var(--line)}
.choice{border:2px solid var(--line);border-radius:18px;padding:12px;background:var(--card);box-shadow:0 4px 0 var(--line);cursor:pointer;text-align:center;font-family:inherit;color:var(--ink)}
.choice.sel{background:var(--mint)}
.choice img{width:72px;height:72px;border-radius:50%;border:2px solid var(--line);background:#fff}
.choice .big{font-size:36px}
.timer{font-size:64px;font-weight:900;text-align:center;margin:6px 0;font-variant-numeric:tabular-nums}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#2C2A26;color:#fff;border:1.5px solid #6B6559;padding:10px 16px;border-radius:14px;font-size:14px;font-weight:700;z-index:99;animation:pop .2s;max-width:90%;text-align:center}
.check{display:flex;gap:12px;align-items:center;padding:12px;border:2px solid var(--line);border-radius:16px;background:var(--white);margin-bottom:8px;cursor:pointer}
.check .bx{width:28px;height:28px;border:2px solid var(--line);border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:900}
.check.on{background:var(--mintL)}.check.on .bx{background:var(--mint)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center;font-size:12px}
.cal div{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;border-radius:10px;font-weight:700}
.cal .d{background:var(--white);border:1.5px solid var(--dash)}
.cal .x{background:var(--mint);border:2px solid var(--line)}
.cal .t{outline:2px dashed var(--coral)}
.pin{display:flex;gap:12px;justify-content:center;margin:14px 0}
.pin i{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);background:var(--white)}
.pin i.f{background:var(--mint)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad .btn{font-size:22px;padding:12px 0}
.burst{position:fixed;inset:0;pointer-events:none;z-index:98;display:flex;align-items:center;justify-content:center}
.burst div{font-size:30px;font-weight:900;background:var(--butter);border:3px solid var(--line);border-radius:20px;padding:12px 22px;box-shadow:0 5px 0 var(--line);animation:boom 1.1s ease forwards}
@keyframes boom{0%{transform:scale(.4);opacity:0}25%{transform:scale(1.1);opacity:1}70%{transform:scale(1);opacity:1}100%{transform:translateY(-40px);opacity:0}}
.live .demo-flag,.live .demo-only{display:none!important}
.genwait{position:fixed;inset:0;z-index:200;background:rgba(40,36,30,.86);display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;padding:24px}.genwait h2{margin:14px 0 4px}.genwait p{opacity:.8;margin:0}.genwait img.shake{animation:eshake .8s ease-in-out infinite}
.demo-flag{background:var(--lavL);border:1.5px dashed #7F77DD;border-radius:12px;padding:8px 10px;font-size:12px;color:#3C3489;margin-bottom:12px}
.weightchart{width:100%;height:110px}
.hidden{display:none}
@media (prefers-color-scheme: dark){
.demo-flag{color:#CECBF6;border-color:#7F77DD}
:root{--page:#121110;--bg:#1C1B18;--card:#26241F;--white:#2F2D27;--ink:#F1ECE1;--sub:#ADA796;--line:#5E5A50;--mintL:#1D3A31;--butterL:#3A311D;--lavL:#2D2B44;--coralL:#3D2822;--dot:#4A463D;--off:#3A372F;--dash:#423E35;--good:#5DCAA5;--zero:#6B6559;--seg:#2F2D27;--bodyBase:#4A463D;--bodyOff:#38352E}
.btn.main,.btn.butter,.btn.lav,.btn.coral,.choice.sel,.check.on .bx,.pill,.flame{color:var(--onc)}
.flame{background:var(--butter);}
.vil{filter:brightness(2.2) saturate(.6)}
.cal .x{color:var(--onc)}
.cover{border:none;border-radius:0}
.mon .pic img,.hero img{filter:brightness(.92)}
}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:0 0 12px;text-align:center}
.week>div{border-radius:14px;padding:6px 0 8px;font-weight:700}
.week .wd{font-size:11px;color:var(--sub)}
.week>div{display:flex;flex-direction:column;align-items:center}
.week .dn{font-size:15px;width:34px;height:34px;border-radius:50%;margin-top:4px;border:2px solid transparent;display:flex;align-items:center;justify-content:center;line-height:1}
.week .done .dn{background:var(--butterL);border-color:var(--line);font-size:18px}
.week .today{background:var(--butterL);border:2px solid var(--line)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 -16px 6px;padding-left:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;font-family:inherit;font-size:13px;font-weight:700;border:2px solid var(--line);border-radius:99px;padding:6px 12px;background:var(--card);color:var(--ink);cursor:pointer}
.chip.on{background:var(--mint);color:var(--onc)}
.libr{display:flex;gap:12px;align-items:center;padding:10px;border:2px solid var(--line);border-radius:18px;background:var(--card);margin-bottom:10px;cursor:pointer;box-shadow:0 3px 0 var(--line)}
.libr .th{width:76px;height:76px;border-radius:14px;border:2px solid var(--line);overflow:hidden;flex-shrink:0;position:relative;background:#fff}
.libr .th img{width:100%;height:100%;object-fit:contain}
.libr .mm{position:absolute;right:-2px;bottom:-2px;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:1px 2px;display:flex}
.coachpop{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;background:rgba(30,28,24,.35);animation:fadein .2s}
.coachpop .inner{width:100%;max-width:430px;padding:0 18px 120px;display:flex;flex-direction:column;align-items:center}
.coachpop img{width:150px;height:150px;border-radius:50%;border:3px solid var(--line);background:#fff;animation:hop 1s cubic-bezier(.3,1.6,.5,1) both,wiggle 2.4s ease-in-out 1s infinite}
.coachpop .say{margin-top:14px;background:var(--white);border:3px solid var(--line);border-radius:22px;padding:14px 16px;font-size:16px;font-weight:700;box-shadow:0 5px 0 var(--line);position:relative;animation:pop .35s .45s both;min-height:58px;max-width:340px}
.coachpop .say::before{content:'';position:absolute;top:-12px;left:50%;margin-left:-10px;border:10px solid transparent;border-bottom-color:var(--line);border-top:0}
.coachpop .tap{margin-top:14px;color:#fff;font-size:13px;font-weight:700;animation:blink 1.4s 1.2s infinite both}
@keyframes hop{0%{transform:translateY(240px) scale(.4)}60%{transform:translateY(-24px) scale(1.08)}80%{transform:translateY(6px) scale(.97)}100%{transform:none}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
@keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.topbar{display:flex;align-items:center;justify-content:space-between;margin:-6px 0 8px}.topbar b{font-weight:900;letter-spacing:1px}
.gear{padding:0;width:40px;height:40px;border-radius:12px;border:2px solid var(--line);background:var(--card);cursor:pointer;box-shadow:0 3px 0 var(--line)}
.pav img{width:100%;height:100%;object-fit:cover}
.ttag{display:inline-block;margin-top:3px;font-size:11px;font-weight:900;border:1.5px solid var(--line);border-radius:99px;padding:0 8px;background:var(--butterL);cursor:pointer}
.pstage{position:fixed;inset:0;z-index:65;background:rgba(30,28,24,.6);display:flex;align-items:flex-end;justify-content:center;animation:fadein .2s}
.pstage .inner{width:100%;max-width:430px;max-height:100vh;overflow:auto;background:var(--bg);border:2px solid var(--line);border-bottom:0;border-radius:28px 28px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;animation:up .3s}
.pstage .stars{font-size:34px;letter-spacing:6px}
.pstage .ttl{font-size:21px;font-weight:900;margin:2px 0 12px;display:flex;align-items:center}
.pbig{position:relative;width:210px;height:210px;border-radius:36px;border:2.5px solid var(--line)}
.pbig img{width:100%;height:100%;object-fit:cover;border-radius:34px}
.pbig.hop{animation:phop .6s cubic-bezier(.3,1.6,.5,1)}.pbig.shake{animation:eshake .5s ease-in-out 2}
@keyframes phop{0%{transform:none}35%{transform:translateY(-22px) scale(1.04)}70%{transform:translateY(2px) scale(.98,1.02)}100%{transform:none}}
.pbig .fx{position:absolute;bottom:40%;font-size:26px;animation:fxup 1.3s ease-out both;pointer-events:none}
@keyframes fxup{0%{opacity:0;transform:translateY(0) scale(.5)}20%{opacity:1}100%{opacity:0;transform:translateY(-130px) scale(1.2)}}
.pstage .say{margin-top:14px;width:100%;background:var(--card);border:2.5px solid var(--line);border-radius:20px;padding:12px 14px;font-size:15px;font-weight:700;box-shadow:0 4px 0 var(--line);min-height:60px}
.pstage .acts{margin-top:14px;width:100%;gap:8px}.pstage .acts .btn{flex:1;padding:12px 4px;font-size:15px}
.pstage #pnext{width:100%}
.petfb{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px}
.petfb .pa{width:64px;height:64px;flex-shrink:0;border-radius:14px;border:2px solid var(--line);overflow:hidden;background:#FBF5E9}.petfb .pa img{width:100%;height:100%;object-fit:cover}
.evo{position:fixed;inset:0;z-index:70;background:rgba(30,28,24,.82);display:flex;align-items:center;justify-content:center;animation:fadein .25s}
.evo .inner{display:flex;flex-direction:column;align-items:center;padding:20px}
.evo .stage{position:relative;width:230px;height:230px}
.evo .stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:36px;border:3px solid #fff;background:#FBF5E9}
.evo .a{animation:eshake .5s ease-in-out 0s 3}
.evo .b{opacity:0}
.evo .flash{position:absolute;inset:-60px;border-radius:50%;background:radial-gradient(#fff,rgba(255,255,255,0) 70%);opacity:0;animation:eflash .9s ease-out 1.2s both}
.evo.go .a{opacity:0}.evo.go .b{animation:pop .5s cubic-bezier(.3,1.6,.5,1) both;opacity:1}
.evo .ttl,.evo .card,.evo .sub,.evo .tap{opacity:0;transition:opacity .3s .2s}
.evo.go .ttl,.evo.go .card,.evo.go .sub,.evo.go .tap{opacity:1}
.evo .ttl{color:#fff;font-size:22px;font-weight:900;margin-top:16px;text-align:center}
.evo .tap{margin-top:14px;color:#fff;font-size:13px;font-weight:700}
@keyframes eshake{0%,100%{transform:rotate(0)}20%{transform:rotate(-8deg) scale(1.02)}40%{transform:rotate(8deg)}60%{transform:rotate(-5deg)}80%{transform:rotate(5deg)}}
@keyframes eflash{0%{opacity:0;transform:scale(.3)}40%{opacity:1}100%{opacity:0;transform:scale(1.3)}}
.eggs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.egg{font-family:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:18px;padding:10px 6px;cursor:pointer;box-shadow:0 3px 0 var(--line)}
.egg img{width:100px;height:100px;object-fit:contain;display:block;margin:0 auto 4px;filter:drop-shadow(0 2px 0 rgba(58,56,51,.25))}
.egg.sel{background:var(--butterL);outline:3px solid var(--butter)}.egg.sel img{animation:wiggle .8s ease-in-out infinite}
.egg.dim{opacity:.35}
.bigpet{width:170px;height:170px;margin:0 auto;border-radius:32px;border:2px solid var(--line);overflow:hidden}.bigpet img{width:100%;height:100%;object-fit:cover}
.dex{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dx{position:relative;font-family:inherit;color:var(--ink);border:2px solid var(--line);border-radius:18px;padding:8px;cursor:pointer;text-align:center;background:var(--card)}
.dx img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;display:block;margin-bottom:4px}
.dx.unk{border-style:dashed;cursor:default}
.tgs{position:absolute;top:6px;left:6px;right:6px;display:flex;flex-wrap:wrap;gap:3px;z-index:1}
.tg{font-size:10px;font-weight:900;border:1.5px solid var(--line);border-radius:99px;padding:0 6px;background:var(--card);color:var(--ink)}.tg.lt{color:#2C2A26}
.atag{display:inline-block;font-size:11px;font-weight:900;border:1.5px solid var(--line);border-radius:99px;padding:1px 8px;color:#2C2A26;margin-top:3px}
.stages{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.stages img,.stages .q{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;border:2px solid var(--line);background:#FBF5E9;display:block}
.stages .q{display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;color:var(--sub);background:var(--off);border-style:dashed}
.story p{font-size:14px;margin:0 0 8px;line-height:1.6}
.fam{display:flex;flex-direction:column;align-items:stretch}
.fm{display:flex;gap:10px;align-items:center;font-family:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:16px;padding:8px;cursor:pointer}
.fm.me{background:var(--butterL)}
.fm img{width:54px;height:54px;border-radius:12px;object-fit:cover;border:1.5px solid var(--line)}
.fam .link{border-left:3px dashed var(--line);margin-left:34px;padding:8px 0 8px 14px;font-size:12px;color:var(--sub)}
.rav{position:relative;flex-shrink:0}.rav .pb{position:absolute;right:-6px;bottom:-6px;width:26px!important;height:26px!important;border-radius:50%!important;border:1.5px solid var(--line);background:#FBF5E9;object-fit:cover}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:8px;margin:6px 0 14px;text-align:center}
.podium .pp img{width:100%;max-width:92px;aspect-ratio:1/1;border-radius:50%;border:3px solid var(--line);background:#fff}
.podium .blk{border:2px solid var(--line);border-bottom:none;border-radius:14px 14px 0 0;margin-top:6px;font-weight:900;font-size:22px;color:var(--onc)}
.rrow{display:flex;align-items:center;gap:10px;padding:10px;border:2px solid var(--line);border-radius:16px;background:var(--card);margin-bottom:8px}
.rrow.me{background:var(--mintL)}
.rrow img{width:46px;height:46px;border-radius:50%;border:2px solid var(--line);background:#fff}
.clap{font-size:20px;border:2px solid var(--line);border-radius:50%;width:42px;height:42px;background:var(--white);cursor:pointer;transition:transform .1s}
.clap.on{background:var(--butter);animation:pop .3s}
.tier{display:flex;gap:12px;align-items:center;padding:10px;border:2px solid var(--line);border-radius:16px;margin-bottom:8px;background:var(--white)}
.tier img{width:68px;height:68px;border-radius:16px;border:2px solid var(--line);background:#fff}
.tier.lock img{filter:grayscale(1) opacity(.5)}
.tier.now{background:var(--mintL)}
</style>
</head>

// ===== 孵蛋寵物系統邏輯（以孵化能量推進） =====
function ensurePets(){
 if(S.pets&&S.pets.v===2)return;
 // Demo 起始：熊霸氣青年，能量 5,600，再一次完整運動就能進化成壯年
 const d=new Date();const dt=n=>{const x=new Date(d);x.setDate(d.getDate()-n);return x.toISOString().slice(0,10)};
 S.pets={v:2,cur:'p1',basket:[],list:[{id:'p1',attr:'peach',col:'peach',e:5600,si:3,sn:9,cnt:11,pid:'kb',gen:1,born:dt(26),hatch:dt(22)}]};
 S.xp=Math.max(S.xp||0,5600);
}
const curPet=()=>S.pets&&S.pets.cur?S.pets.list.find(p=>p.id===S.pets.cur):null;
const petById=id=>S.pets.list.find(p=>p.id===id);
function stIdx(e){let i=0;PST.forEach((s,j)=>{if(e>=s.at)i=j});return i}
function stKey(p){return PST[p.si||0].k}
const PD=p=>(p.g&&p.g.t&&p.g.t.name)?p.g.t:(PETS[p.pid]||PETS[p.parent?'kb2':'kb']);
const genImg=(p,k)=>{const m=p.g&&p.g.img;if(!m)return '';if(m[k])return m[k];const o=['baby','teen','adult','old'];let i=o.indexOf(k);for(let j=i-1;j>=0;j--)if(m[o[j]])return m[o[j]];for(const x of o)if(m[x])return m[x];return ''};
function petImg(p,k){k=k||stKey(p);if(k==='egg'||k==='crack'||!p.pid)return IMG['egg_'+p.attr+(k==='crack'?'_c':'')];return genImg(p,k)||IMG[(PETS[p.pid]||PETS[p.parent?'kb2':'kb']).img[k]]}
function petFilt(p,k){k=k||stKey(p);if(!p.pid||k==='egg'||k==='crack'||genImg(p,k))return '';return FILT[p.col]||''}
function petPic(p,k,style){return `<img decoding="async" src="${petImg(p,k)}" style="${style||''};filter:${petFilt(p,k)||'none'}" alt="">`}
function petName(p){return p.pid&&p.si>=2?PD(p).name:ATTR[p.attr].n+'蛋'}
function nextSt(p){const i=p.si||0;return i<PST.length-1?PST[i+1]:null}
function petProg(p){const i=p.si||0,nx=PST[i+1];if(!nx)return 1;return Math.max(0,Math.min(1,(p.e-PST[i].at)/(nx.at-PST[i].at)))}
function petNextTxt(p){const nx=nextSt(p);if(!nx)return '陪練中';if(p.e>=nx.at)return '能量滿了！打卡就會有變化';return `再 ${(nx.at-p.e).toLocaleString()} ⚡ → ${nx.k==='old'?'？？？':nx.n}`}
function hatchPet(p){if(p.pid)return;p.pid=(p.g&&p.g.t&&p.g.t.name)?'g':(p.parent?'kb2':'kb');p.hatch=today()}
// 稱號
function dexPets(){return S.pets.list.filter(p=>p.pid&&p.si>=2&&!p.gone)}
function titleInfo(){
 const n=dexPets().length;let cur=PTITLES[0];PTITLES.forEach(t=>{if(n>=t[0])cur=t});
 const sp={four:Object.keys(ATTR).every(k=>dexPets().some(p=>p.attr===k)),gen3:S.pets.list.some(p=>p.gen>=3&&p.pid&&p.si>=2)};
 const sel=S.titleSel&&sp[S.titleSel]?SPTITLES.find(t=>t.k===S.titleSel).n:cur[1];
 return{n,cur,sp,title:sel};
}
function titleSheet(){
 const T=titleInfo();
 sheet(`<div style="text-align:center"><div style="font-size:40px">🏷️</div><h2 style="margin:4px 0 2px">${T.title}</h2><p class="sub">圖鑑裡有 ${T.n} 隻寵物，收集越多稱號越厲害</p></div>
  ${PTITLES.map(t=>`<div class="tier ${T.n<t[0]?'lock':''} ${t===T.cur?'now':''}"><div style="font-size:24px;width:40px;text-align:center">${t[1].split(' ')[0]}</div><div style="flex:1"><b>${t[1].split(' ')[1]}</b><div class="sub">收集 ${t[0]} 隻${T.n<t[0]?`（還差 ${t[0]-T.n} 隻）`:''}</div></div>${t===T.cur?'<span class="pill" style="background:var(--butter);color:#2C2A26">現在</span>':''}</div>`).join('')}
  <h3 style="margin:14px 0 6px">特殊稱號</h3>
  ${SPTITLES.map(t=>`<div class="tier ${T.sp[t.k]?'':'lock'}"><div style="font-size:24px;width:40px;text-align:center">${t.n.split(' ')[0]}</div><div style="flex:1"><b>${t.n.split(' ')[1]}</b><div class="sub">${t.d}</div></div>${T.sp[t.k]?`<button class="btn sm ${S.titleSel===t.k?'butter':''}" data-ts="${t.k}">${S.titleSel===t.k?'使用中':'換上'}</button>`:'🔒'}</div>`).join('')}
  <p class="sub">⚡ 孵化能量怎麼拿：每完成一組 +10、完成一個動作 +30、暖身／收操各 +20、打卡 +50（全部完成再 +50）、量體重／拍存檔照各 +10。沒暖身的話，運動拿到的能量只有 ×0.7。</p>
  <button class="btn main" onclick="closeSheet()">繼續冒險</button>`);
 document.querySelectorAll('[data-ts]').forEach(b=>b.onclick=()=>{S.titleSel=S.titleSel===b.dataset.ts?null:b.dataset.ts;save();titleSheet();if($('#hud'))tab('map')});
}
// 打卡時結算寵物（劇情、進化）
function petCheck(){
 const p=curPet();if(!p)return null;
 const before=p.si||0;const after=stIdx(p.e);
 const ev={id:p.id,before,after,line:'',story:''};
 if(after>=2&&!p.pid)hatchPet(p);
 if(after===5&&before<5)ev.story=PD(p).old;
 else if(after>=2){if((p.sn||0)<12){p.sn=(p.sn||0)+1;ev.story=PD(p).story[p.sn-1];ev.no=p.sn}else ev.line=pick(PD(p).lines)}
 else if(after===1)ev.line=CRACK_LINE;
 else ev.line=pick(EGG_LINES);
 p.si=after;p.cnt=(p.cnt||0)+1;
 if(after===5&&before<5){p.done=1;S.pets.basket.push({attr:p.attr,parent:p.id,e:0});S.pets.cur=null}
 save();return ev;
}
// 打卡後的寵物互動畫面
function petStage(ev,xp,stars,done,note){
 const o=document.createElement('div');o.className='pstage';
 const p=ev&&petById(ev.id);
 const showK=p?PST[ev.before].k:null;
 const isEgg=!p||ev.before<2;
 const acts=isEgg?[['pat','🤚 摸摸蛋']]:[['hi5','✋ 擊掌'],['pat','🤚 摸摸頭'],['snack','🍪 餵點心']];
 o.innerHTML=`<div class="inner">
  <div class="stars">${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}</div>
  <div class="ttl">冒險完成！<span class="pill" style="background:var(--butter);color:#2C2A26;font-size:15px;padding:4px 12px;margin-left:6px">+${xp} ⚡</span></div>
  ${note?`<div class="sub" style="margin:-6px 0 10px;text-align:center">⛺ ${note}</div>`:''}
  ${p?`<div class="pbig" id="pbig" style="background:${ATTR[p.col].c}33">${petPic(p,showK)}</div>
   <div class="say"><div style="font-size:11px;color:var(--sub);margin-bottom:2px">${p.pid&&ev.before>=2?PD(p).name:ATTR[p.attr].n+'蛋'}${ev.no?`・劇情 ${ev.no}/12`:''}</div><span id="psay">${ev.story||ev.line}</span></div>
   <div class="row acts" id="acts">${acts.map(([k,n])=>`<button class="btn" data-a="${k}">${n}</button>`).join('')}</div>
   <button class="btn main" id="pnext" style="display:none;margin-top:10px">${ev.after!==ev.before?'咦？牠好像有變化……':'明天見！'}</button>`
  :`<div class="say">還沒有在孵的蛋，去選一顆吧！</div><button class="btn main" id="pnext" style="margin-top:12px">去選蛋</button>`}
  <div class="demo-flag" style="margin-top:12px">正式版：這筆打卡會送到你的 Google 試算表後台；寵物台詞由 Gemini 依個性生成。</div>
 </div>`;
 document.body.appendChild(o);
 const nx=o.querySelector('#pnext');
 nx.onclick=()=>{o.remove();if(!p)return viewEggs();petAfter(ev,done)};
 o.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{
  const a=b.dataset.a;const big=o.querySelector('#pbig');
  big.classList.remove('hop');void big.offsetWidth;big.classList.add(a==='pat'&&isEgg?'shake':'hop');
  const fx={hi5:'✋',pat:'💗',snack:'🍪'}[a];
  for(let i=0;i<6;i++){const h=document.createElement('span');h.className='fx';h.textContent=i%2?fx:'💗';h.style.left=(20+Math.random()*60)+'%';h.style.animationDelay=(i*0.08)+'s';big.appendChild(h);setTimeout(()=>h.remove(),1400)}
  const line=isEgg?pick(EGG_PAT):pick(PD(p).act[a]);
  const el=o.querySelector('#psay');el.textContent='';let i=0;const iv=setInterval(()=>{if(!el.isConnected)return clearInterval(iv);el.textContent=line.slice(0,++i);if(i>=line.length)clearInterval(iv)},45);
  o.querySelector('#acts').style.display='none';nx.style.display='block';
 });
}
// 進化／孵化動畫
function evoAnim(ev,cb){
 const p=petById(ev.id);const from=PST[ev.before].k,to=PST[ev.after].k;
 const o=document.createElement('div');o.className='evo';
 const title=to==='crack'?'蛋裂開了！':to==='baby'?`孵化成功！是「${PD(p).name}」！`:to==='old'?`${PD(p).name} 變成老年了…！`:`${PD(p).name} 進化成${PST[ev.after].n}！`;
 o.innerHTML=`<div class="inner"><div class="stage"><img class="a" src="${petImg(p,from)}" style="filter:${petFilt(p,from)||'none'}"><img class="b" src="${petImg(p,to)}" style="filter:${petFilt(p,to)||'none'}"><div class="flash"></div></div>
  <div class="ttl">${title}</div>
  ${to==='baby'?`<div class="card" style="text-align:left;margin:10px 0 0;max-width:340px"><div class="sub">${ATTR[p.col].i} ${ATTR[p.attr].n}・${PD(p).style}・${PD(p).proto}${p.mut?'・<b style="color:var(--coral)">突變！</b>':''}</div><div style="font-size:14px;margin-top:4px">${PD(p).pun}</div><div style="font-size:14px;margin-top:6px"><b>口頭禪：</b>${PD(p).catch}</div></div>`:''}
  ${to==='teen'||to==='adult'?`<div class="sub" style="color:#fff;margin-top:6px;max-width:320px;text-align:center">${PD(p).evo[to]}</div>`:''}
  <div class="tap">點一下繼續</div></div>`;

}

function swapSheet(slot,r,ex){

  <h3>⚠️ 常見錯誤</h3><ul class="tips">${ex.err.map(t=>'<li>'+t+'</li>').join('')}</ul>
  ${v?`<a class="btn lav" style="width:100%;margin:4px 0" href="https://www.youtube.com/watch?v=${v[0]}" target="_blank" rel="noopener">▶️ 偷看示範影片</a><p class="sub" style="text-align:center">🎬 ${v[1]}・${v[2]}（YouTube）</p>`:''}
  <button class="btn main" onclick="closeSheet()">關閉</button>`);
}
function viewLib(){
 let cat=window._libc||'all',q='';
 const draw=()=>{
  let list=EX.filter(e=>cat==='all'||e.c===cat);if(q)list=list.filter(e=>e.n.includes(q));
  app.innerHTML=`<div class="screen">
   <h1>📚 動作圖鑑</h1>
   <input id="q" placeholder="搜尋動作，例如 深蹲" value="${q}" style="margin:6px 0 10px">
   <div class="chips">${[['all','全部']].concat(['act','glute','gacc','quad','hip','hipst','ham','hpull','hpush','vpull','vpush','core','lat','iso'].map(k=>[k,CATS[k].name])).map(([k,n])=>`<button class="chip ${cat===k?'on':''}" data-c="${k}">${n}</button>`).join('')}</div>
   <p class="sub">${cat==='all'?'全部':CATS[cat].name}・${list.length} 個動作</p>
   <div id="liblist"></div><div id="libmore" style="height:40px"></div>
   ${''}${[].map(e=>`<div class="libr" data-id="${e.id}"><div class="th"><img decoding="async" src="${exImg(e.id,e.img)}" alt=""><div class="mm">${bodySVG(EXMUS[e.id]?.p.some(g=>['glute','ham','lb','back','trap','tri','gmed','calf'].includes(g))?'back':'front',exGlv(e.id),30)}</div></div>
    <div style="flex:1;min-width:0"><b style="font-size:16px">${e.n}</b><div class="sub">${CATS[e.c].name}｜${e.eq.map(x=>EQUIP[x]).join('、')}</div><div class="sub" style="font-size:12px">${'⭐'.repeat(e.lv)}${e.home?'　🏠 居家可做':''}</div></div><span style="font-size:18px">›</span></div>`).join('')}
  </div>`;
  app.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{cat=window._libc=b.dataset.c;draw()});
  const qi=$('#q');qi.oninput=()=>{q=qi.value.trim();const pos=qi.selectionStart;draw();const n=$('#q');n.focus();n.setSelectionRange(pos,pos)};
  const row=e=>`<div class="libr" data-id="${e.id}"><div class="th"><img decoding="async" loading="lazy" src="${exImg(e.id,e.img)}" alt=""><div class="mm">${bodySVG(EXMUS[e.id]?.p.some(g=>['glute','ham','lb','back','trap','tri','gmed','calf'].includes(g))?'back':'front',exGlv(e.id),30)}</div></div>
    <div style="flex:1;min-width:0"><b style="font-size:16px">${e.n}</b><div class="sub">${CATS[e.c].name}｜${e.eq.map(x=>EQUIP[x]).join('、')}</div><div class="sub" style="font-size:12px">${'⭐'.repeat(e.lv)}${e.home?'　🏠 居家可做':''}</div></div><span style="font-size:18px">›</span></div>`;
  let shown=0;const box=$('#liblist');
  const more=()=>{const next=list.slice(shown,shown+20);if(!next.length)return;box.insertAdjacentHTML('beforeend',next.map(row).join(''));shown+=next.length;box.querySelectorAll('.libr:not([data-b])').forEach(r=>{r.dataset.b=1;r.onclick=()=>exDetail(EXI[r.dataset.id])})};
  more();if(window._libio)window._libio.disconnect();
  window._libio=new IntersectionObserver(es=>{if(es.some(x=>x.isIntersecting))more()},{rootMargin:'600px'});window._libio.observe($('#libmore'));
 };draw();
}

// ================= 排行榜 =================
function rng(seed){let x=seed*9301+49297;return()=>{x=(x*9301+49297)%233280;return x/233280}}
function friendHistory(f){
 if(f._h)return f._h;const r=rng(f.seed);const h=[];const d=new Date();
 for(let i=60;i>=0;i--){const x=new Date(d);x.setDate(d.getDate()-i);if(r()<0.25+f.seed%5*0.06)h.push({date:x.toISOString().slice(0,10),xp:Math.round(90+r()*120),kg:Math.round(2500+r()*9000)})}
 return f._h=h}
function syncPets(m){if(!m)return;let ch=0;S.pets.list.forEach(p=>{const r=m[p.id];if(!r||!p.g)return;if(r.status==='hidden'){if(!p.g.hidden){p.g.hidden=1;p.g.img={};ch=1}}else{const a=JSON.stringify(p.g.img||{}),b=JSON.stringify(r.img||{});if(a!==b||p.g.hidden){p.g.img=r.img||{};delete p.g.hidden;ch=1}}});if(ch)save()}
function viewRank(){
 let per=window._rp||'week';let srv=null;
 const pImg=p=>{if(p.u)return{src:p.u,f:''};try{return{src:petImg(p,p.k),f:petFilt(p,p.k)}}catch(e){return null}};
 const draw=()=>{
  if(LIVE&&!srv){app.innerHTML='<div class="screen"><h1>🏆 排行榜</h1><p class="sub" style="text-align:center;margin-top:30px">讀取大家的冒險紀錄中…</p></div>';return}
  const now=new Date();let from;
  if(per==='week')from=weekStart();else if(per==='month')from=new Date(now.getFullYear(),now.getMonth(),1);else from=new Date(2000,0,1);
  const sum=h=>h.filter(x=>new Date(x.date)>=from).reduce((a,x)=>({xp:a.xp+(x.xp||0),cnt:a.cnt+1}),{xp:0,cnt:0});
  const cp=curPet();const me={n:S.user.name+'（你）',img:IMG[COACH[S.settings.coach].img],pet:cp?{src:petImg(cp),f:petFilt(cp)}:null,t:titleInfo().title,me:1,...sum(S.history)};
  let all;
  if(LIVE){all=srv.users.filter(u=>u.n!==S.user.name).map(u=>({n:u.n,raw:u.n,img:IMG[(COACH[u.coach]||COACH.cheer).img],pet:u.pet?pImg(u.pet):null,t:u.t,claps:u.claps,...sum((u.h||[]).map(([date,xp])=>({date,xp})))}));const mine=srv.users.find(u=>u.n===S.user.name);me.claps=mine?mine.claps:0;all.push(me)}
  else all=[me,...FRIENDS.map((f,i)=>({n:f.n,raw:f.n,img:IMG[COACH[f.c].img],pet:FPET[i%FPET.length],t:FTITLE[i%FTITLE.length],...sum(friendHistory(f))}))];
  all.sort((a,b)=>b.xp-a.xp);
  const clapped=k=>LIVE?srv.clapped.includes(k):S.claps[k]===today();
  const top=[all[1],all[0],all[2]];const hgt=[70,100,52];const col=['#CFC6B1','#FAC775','#F0997B'];
  S.claps=S.claps||{};
  app.innerHTML=`<div class="screen">
   <h1>🏆 排行榜</h1>
   <div class="row" style="margin:8px 0 6px;background:var(--seg);border:2px solid var(--line);border-radius:14px;padding:3px;gap:4px">${[['week','週榜'],['month','月榜'],['all','總榜']].map(([k,n])=>`<button class="btn sm ${per===k?'butter':'ghost'}" style="flex:1;box-shadow:none;border:${per===k?'2px solid var(--line)':'none'}" data-p="${k}">${n}</button>`).join('')}</div>
   <p class="sub" style="text-align:center">比的是 ⚡ 孵化能量，練越多、練越完整分數越高</p>
   <div class="podium">${top.map((u,i)=>u?`<div class="pp"><img decoding="async" src="${u.pet?u.pet.src:u.img}" style="filter:${u.pet&&u.pet.f||'none'};object-fit:contain" alt=""><div style="font-weight:900;font-size:13px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${u.n}</div><div style="font-weight:900;color:var(--good)">${u.xp.toLocaleString()} ⚡</div><div class="blk" style="height:${hgt[i]}px;background:${col[i]};line-height:${hgt[i]}px">${[2,1,3][i]}</div></div>`:'<div></div>').join('')}</div>
   ${all.map((u,i)=>`<div class="rrow ${u.me?'me':''}"><b style="width:22px;text-align:center;font-size:18px">${i+1}</b><div class="rav"><img decoding="async" src="${u.pet?u.pet.src:u.img}" style="filter:${u.pet&&u.pet.f||'none'};object-fit:contain" alt="">${u.pet?`<img class="pb" src="${u.img}" alt="教練">`:''}</div><div style="flex:1;min-width:0"><b>${u.n}</b><div class="sub">${u.t||''}</div><div class="sub">${u.xp.toLocaleString()} ⚡・冒險 ${u.cnt} 次${LIVE&&u.claps?`・今天收到 ${u.claps} 個👏`:''}</div></div>${u.me?'':`<button class="clap ${clapped(u.raw)?'on':''}" data-n="${u.raw}" aria-label="拍手">👏</button>`}</div>`).join('')}
   ${LIVE?(all.length<2?'<p class="sub" style="text-align:center;margin-top:12px">還沒有其他冒險者，把網址傳給朋友一起來練吧！</p>':''):'<div class="demo-flag" style="margin-top:12px">示範資料：正式版會顯示用同一組邀請碼加入的朋友。</div>'}
  </div>`;
  app.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{per=window._rp=b.dataset.p;draw()});
  app.querySelectorAll('.clap').forEach(b=>b.onclick=async()=>{const k=b.dataset.n;if(clapped(k))return toast('今天已經幫 '+k+' 拍過手了');
   if(LIVE){srv.clapped.push(k);const u=srv.users.find(x=>x.n===k);if(u)u.claps=(u.claps||0)+1;burst('👏 幫 '+k+' 加油！');draw();try{const j=await api('clap',Object.assign(authBody(),{to:k}));if(!j.ok)toast(j.err)}catch(e){}return}
   S.claps[k]=today();save();burst('👏 幫 '+k+' 加油！');draw()});
 };draw();
 if(LIVE&&S.auth){api('save',Object.assign(authBody(),{data:cloudData(),summary:cloudSum()})).then(()=>api('board',authBody())).then(j=>{if(j.ok){srv=j;syncPets(j.pets);draw()}else toast(j.err||'讀取失敗')}).catch(e=>{if(e.message!=='auth'){srv={users:[],clapped:[]};draw();toast('連不上伺服器')}})}
}

// ================= 導覽 =================
function tab(t){$('#nav').classList.remove('hidden');document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));window.scrollTo(0,0);({map:viewMap,lib:viewLib,rank:viewRank,log:viewLog,set:viewSet,dex:viewDex})[t]()}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>tab(b.dataset.tab));
if(LIVE){document.body.classList.add('live');loadCfg()}
if(!S.user||(LIVE&&!S.auth))viewLogin();else if(!S.session||S.session.date!==today())viewDepart();else tab('map');
</script>
