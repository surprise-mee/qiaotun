<html lang="zh-Hant">

<base target="_top">

<style>
:root{--ink:#3A3833;--bg:#FBF5E9;--card:#FFFDF8;--butter:#FAC775;--mint:#5DCAA5;--coral:#F0997B;--lav:#C9C3F2;--sub:#7A776E;--line:#E6DCC6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Noto Sans TC",sans-serif;font-size:15px}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:2px solid var(--ink);background:var(--card);position:sticky;top:0;z-index:5}
header b{font-size:18px}header .sp{flex:1}
nav{display:flex;gap:6px;padding:10px 16px;overflow-x:auto;border-bottom:1px dashed var(--line);background:var(--bg);position:sticky;top:55px;z-index:4}
nav button{white-space:nowrap}
nav button.on{background:var(--butter)}
.w{max-width:1000px;margin:0 auto;padding:16px}
h2{font-size:19px;margin:6px 0 12px}
.card{background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:14px;margin:12px 0;box-shadow:0 3px 0 var(--ink)}
input,select{font:inherit;padding:9px 11px;border:2px solid var(--ink);border-radius:12px;background:#fff;min-width:0}
button{font:inherit;font-weight:800;padding:8px 13px;border:2px solid var(--ink);border-radius:12px;background:#fff;cursor:pointer;box-shadow:0 2px 0 var(--ink)}
button.y{background:var(--butter)}button.m{background:var(--mint)}button.r{background:var(--coral)}button.s{padding:4px 9px;font-size:12px;box-shadow:0 1px 0 var(--ink)}
button:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sub{color:var(--sub);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:#fff;border:2px solid var(--ink);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:24px}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 6px;border-bottom:1px dashed var(--line);text-align:left;vertical-align:middle}
th{font-size:12px;color:var(--sub);font-weight:700;cursor:pointer;white-space:nowrap}
td.n{font-weight:800}
.tw{overflow-x:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.pet{background:#fff;border:2px solid var(--ink);border-radius:16px;padding:10px}
.pet.off{opacity:.5}
.st4{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:8px 0}
.st4 div{text-align:center;font-size:11px;color:var(--sub)}
.st4 img,.st4 .ph{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;border:1.5px solid var(--line);background:#F8F0E3;display:block;cursor:pointer}
.st4 .ph{display:flex;align-items:center;justify-content:center;font-size:18px;cursor:default}
.tag{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:99px;border:1.5px solid var(--ink);margin:2px 3px 0 0}
.ex{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.exc{background:#fff;border:2px solid var(--ink);border-radius:14px;padding:8px}
.exc.hid{opacity:.5;background:#eee}
.exc img{width:100%;aspect-ratio:1;object-fit:contain;background:#F7EFE6;border-radius:10px;display:block}
.exc b{display:block;font-size:13px;margin:6px 0 2px;line-height:1.3}
.pill{font-size:11px;padding:1px 7px;border-radius:99px;background:var(--lav);font-weight:800}
.pill.new{background:var(--mint)}
#msg{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;display:none;max-width:90%;z-index:99}
#big{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
#big img{max-width:100%;max-height:90vh;border-radius:16px;background:#fff}
.bar{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:10px}
.bar div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--sub)}
.bar i{display:block;width:100%;background:var(--butter);border:1.5px solid var(--ink);border-radius:6px 6px 0 0}
.bar em{font-style:normal;font-weight:800;color:var(--ink)}
.quota{height:14px;border:2px solid var(--ink);border-radius:99px;overflow:hidden;background:#fff}
.quota i{display:block;height:100%;background:var(--mint)}
label.f{display:block;margin:10px 0 4px;font-weight:800;font-size:14px}
</style>
</head>

  const L = EXLIST.filter(e => (EXF==='all' || (EXF==='show'?!isHidden(e):EXF==='hide'?isHidden(e):EXF==='mine'?(EXO[e.id]&&EXO[e.id].u):e.cat===EXF)) && (!EXQ || e.n.includes(EXQ) || e.id.includes(EXQ)));
  $('#main').innerHTML = `<h2>🏋️ 動作圖管理</h2>
  ${SITE?'':'<div class="card" style="background:#FFF3D6">還沒填「前台網址」，所以看不到原本的插圖。到 ⚙️ 設定填上 GitHub Pages 網址就會顯示。</div>'}
  <div class="row"><input id="q" placeholder="搜尋動作名稱" value="${esc(EXQ)}" style="flex:1;min-width:160px">
    <select id="f">${[['show','前台顯示中'],['hide','已隱藏'],['mine','已換過圖'],['all','全部']].concat(cats.map(c=>[c,c])).map(([k,n])=>`<option value="${esc(k)}" ${EXF===k?'selected':''}>${esc(n)}</option>`).join('')}</select></div>
  <p class="sub">共 ${L.length} 個。「換圖」上傳後前台馬上生效（玩家下次開網頁會看到）；建議用兩格流程圖、橫式 3:2，會自動縮小成 960px 和 320px 縮圖。</p>
  <div class="ex">${L.map(e=>{const o=EXO[e.id]||{},h=isHidden(e),src=exThumb(e);return `<div class="exc ${h?'hid':''}">
    ${src?`<img src="${esc(src)}" loading="lazy" data-z="${esc(o.u||(SITE?SITE.replace(/\/?$/,'/')+'ex/'+e.id+'.webp':src))}" onerror="this.style.visibility='hidden'">`:'<div style="aspect-ratio:1;background:#F7EFE6;border-radius:10px"></div>'}
    <b>${esc(e.n)}</b><div class="sub">${esc(e.cat)}${o.u?' <span class="pill new">已換圖</span>':''}${h?' <span class="pill">隱藏</span>':''}</div>
    <div class="row" style="gap:4px;margin-top:6px"><button class="s y" data-up="${e.id}">換圖</button><button class="s" data-hd="${e.id}">${h?'顯示':'隱藏'}</button>${o.u?`<button class="s" data-rs="${e.id}">還原</button>`:''}</div>
  </div>`}).join('')}</div>
  <input type="file" id="file" accept="image/*" style="display:none">`;
  $('#q').oninput=e=>{EXQ=e.target.value;clearTimeout(window._qt);window._qt=setTimeout(()=>{drawEx();$('#q').focus();$('#q').setSelectionRange(EXQ.length,EXQ.length)},300)};
  $('#f').onchange=e=>{EXF=e.target.value;drawEx()};
  document.querySelectorAll('[data-z]').forEach(i=>i.onclick=()=>zoom(i.dataset.z));
  document.querySelectorAll('[data-hd]').forEach(b=>b.onclick=async()=>{const e=EXLIST.find(x=>x.id===b.dataset.hd);EXO[e.id]=await api('adminExSet',e.id,!isHidden(e));toast(isHidden(e)?'已隱藏':'已顯示');drawEx()});
  document.querySelectorAll('[data-rs]').forEach(b=>b.onclick=async()=>{if(!confirm('還原成原本的插圖？'))return;const r=await api('adminExReset',b.dataset.rs);if(r)EXO[b.dataset.rs]=r;else delete EXO[b.dataset.rs];drawEx()});
  document.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{const f=$('#file');f.value='';f.onchange=()=>upload(b.dataset.up,f.files[0],b);f.click()});
}
function loadImg(file){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=r.result};r.onerror=no;r.readAsDataURL(file)})}
function canvasOut(c){const w=c.toDataURL('image/webp',0.82);return w.startsWith('data:image/webp')?w:c.toDataURL('image/jpeg',0.85)}
async function upload(id,file,btn){
  if(!file)return;
  btn.disabled=true;btn.textContent='上傳中…';
  try{
    const im=await loadImg(file);
    const s=Math.min(1,960/im.width);const c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);const big=canvasOut(c);
    const t=document.createElement('canvas');t.width=t.height=320;const g=t.getContext('2d');g.fillStyle='#F7EFE6';g.fillRect(0,0,320,320);
    const k=Math.min(320/im.width,320/im.height);const w=im.width*k,h=im.height*k;g.drawImage(im,(320-w)/2,(320-h)/2,w,h);const th=canvasOut(t);
    const mime=big.slice(5,big.indexOf(';'));
    EXO[id]=await api('adminExUpload',id,big.split(',')[1],th.split(',')[1],mime);toast('換好了！');drawEx();
  }catch(e){btn.disabled=false;btn.textContent='換圖'}
}

// ================= 素材（封面、教練、蛋…） =================
let IMGO = {}, IMGSZ = {};
async function as(){ const r = await api('adminImgGet'); IMGO = r.img || {}; IMGSZ = r.sz || {}; SITE = r.site || SITE; drawAs(); }
const assetSrc = a => IMGO[a.k] || (SITE ? SITE.replace(/\/?$/,'/') + 'img/' + a.k + '.' + a.ext : '');
function drawAs(){
  const groups = [...new Set(ASSETS.map(a=>a.g))];
  $('#main').innerHTML = `<h2>🖼️ 固定素材</h2>
  ${SITE?'':'<div class="card" style="background:#FFF3D6">還沒填「前台網址」，看不到原本的圖。到 ⚙️ 設定填上 GitHub Pages 網址。</div>'}
  <p class="sub">換圖時可以選「去背」，會把圖片邊緣的單色背景挖掉，滑桿調整去背的範圍，確認預覽滿意再上傳。玩家下次開網頁就會看到新圖；不滿意隨時「還原」。</p>
  ${groups.map(g=>`<h3 style="margin:18px 0 8px">${esc(g)}</h3><div class="ex">${ASSETS.filter(a=>a.g===g).map(a=>{const src=assetSrc(a);return `<div class="exc">
    <div style="background:repeating-conic-gradient(#eee 0 25%,#fff 0 50%) 0 0/16px 16px;border-radius:10px">${src?`<img src="${esc(src)}" loading="lazy" style="background:transparent" data-z="${esc(src)}" onerror="this.style.visibility='hidden'">`:'<div style="aspect-ratio:1"></div>'}</div>
    <b>${esc(a.n)}</b><div class="sub">${esc(a.k)}${IMGO[a.k]?' <span class="pill new">已換圖</span>':''}</div>
    <div class="row" style="gap:4px;margin-top:6px"><button class="s y" data-au="${a.k}">換圖</button>${IMGO[a.k]?`<button class="s" data-ar="${a.k}">還原</button>`:''}</div>
    ${a.sz?`<div style="margin-top:8px"><span class="sub">顯示大小 <b id="szv_${a.k}">${IMGSZ[a.k]||100}%</b></span><input type="range" min="30" max="200" step="5" value="${IMGSZ[a.k]||100}" data-sz="${a.k}" style="width:100%;padding:0;border:none"><button class="s m" data-szs="${a.k}" style="width:100%">儲存大小</button></div>`:''}</div>`}).join('')}</div>`).join('')}
  <input type="file" id="afile" accept="image/*" style="display:none">`;
  document.querySelectorAll('[data-z]').forEach(i=>i.onclick=()=>zoom(i.dataset.z));
  document.querySelectorAll('[data-sz]').forEach(r=>r.oninput=()=>{$('#szv_'+r.dataset.sz).textContent=r.value+'%'});
  document.querySelectorAll('[data-szs]').forEach(b=>b.onclick=async()=>{const k=b.dataset.szs,v=document.querySelector('[data-sz="'+k+'"]').value;IMGSZ[k]=await api('adminImgSize',k,v);toast('已儲存，玩家重新整理後生效')});
  document.querySelectorAll('[data-ar]').forEach(b=>b.onclick=async()=>{if(!confirm('還原成原本的圖？'))return;await api('adminImgReset',b.dataset.ar);delete IMGO[b.dataset.ar];toast('已還原');drawAs()});
  document.querySelectorAll('[data-au]').forEach(b=>b.onclick=()=>{const f=$('#afile');f.value='';f.onchange=async()=>{if(f.files[0])editor(ASSETS.find(a=>a.k===b.dataset.au),await loadImg(f.files[0]))};f.click()});
}
// 去背編輯器
function editor(a, im){
  const MAX = a.max || 800, k = Math.min(1, MAX / Math.max(im.width, im.height));
  const W = Math.round(im.width * k), H = Math.round(im.height * k);
  const src = document.createElement('canvas'); src.width = W; src.height = H; src.getContext('2d').drawImage(im, 0, 0, W, H);
  const base = src.getContext('2d').getImageData(0, 0, W, H);
  const ov = document.createElement('div');
  ov.style.cssText = 'position:fixed;inset:0;background:#000a;z-index:60;display:flex;align-items:center;justify-content:center;padding:16px';
  ov.innerHTML = `<div class="card" style="max-width:560px;width:100%;max-height:94vh;overflow:auto;margin:0">
    <h2 style="margin-top:0">換「${esc(a.n)}」</h2>
    <div style="background:repeating-conic-gradient(#ddd 0 25%,#fff 0 50%) 0 0/16px 16px;border-radius:12px;text-align:center;padding:8px"><canvas id="cv" style="max-width:100%;max-height:50vh"></canvas></div>
    <label class="row" style="margin-top:10px"><input type="checkbox" id="rb" ${a.bg?'checked':''}> <b>去背</b><span class="sub">（挖掉邊緣跟角落顏色接近的背景）</span></label>
    <div class="row" style="margin-top:6px"><span class="sub">範圍</span><input type="range" id="tol" min="5" max="120" value="40" style="flex:1"><span id="tv" class="sub">40</span></div>
    <p class="sub">建議：去背的圖用透明背景（棋盤格就是透明）；如果主角邊緣被吃掉，就把範圍調小。</p>
    <div class="row"><button id="cx" style="flex:1">取消</button><button class="y" id="ok" style="flex:1">上傳</button></div></div>`;
  document.body.appendChild(ov);
  const cv = ov.querySelector('#cv'); cv.width = W; cv.height = H; const g = cv.getContext('2d');
  const draw = () => {
    const tol = +ov.querySelector('#tol').value; ov.querySelector('#tv').textContent = tol;
    const d = new ImageData(new Uint8ClampedArray(base.data), W, H);
    if (ov.querySelector('#rb').checked) removeBg(d, W, H, tol);
    g.clearRect(0, 0, W, H); g.putImageData(d, 0, 0);
  };
  ov.querySelector('#tol').oninput = draw; ov.querySelector('#rb').onchange = draw; draw();
  ov.querySelector('#cx').onclick = () => ov.remove();
  ov.querySelector('#ok').onclick = async () => {
    const b = ov.querySelector('#ok'); b.disabled = true; b.textContent = '上傳中…';
    let url = cv.toDataURL('image/webp', 0.9); if (!url.startsWith('data:image/webp')) url = cv.toDataURL('image/png');
    try { IMGO[a.k] = await api('adminImgUpload', a.k, url.split(',')[1], url.slice(5, url.indexOf(';'))); ov.remove(); toast('換好了！'); drawAs(); }
    catch (e) { b.disabled = false; b.textContent = '上傳'; }
  };
}
function removeBg(d, W, H, tol){
  const p = d.data, at = (x, y) => (y * W + x) * 4;
  const cs = [[0,0],[W-1,0],[0,H-1],[W-1,H-1]].map(([x,y]) => at(x,y));
  const bg = [0,1,2].map(c => cs.reduce((s,i) => s + p[i+c], 0) / 4);
  const dist = i => Math.max(Math.abs(p[i]-bg[0]), Math.abs(p[i+1]-bg[1]), Math.abs(p[i+2]-bg[2]));
  const seen = new Uint8Array(W * H), st = [];
  for (let x = 0; x < W; x++) { st.push(x, (H-1)*W + x); }
  for (let y = 0; y < H; y++) { st.push(y*W, y*W + W - 1); }
  while (st.length) {
    const n = st.pop(); if (seen[n]) continue; seen[n] = 1;
    const i = n * 4; const dd = dist(i);
    if (dd > tol) continue;
    p[i+3] = dd > tol * 0.6 ? Math.round(255 * (dd - tol * 0.6) / (tol * 0.4)) : 0;
    const x = n % W, y = (n / W) | 0;
    if (x > 0) st.push(n - 1); if (x < W - 1) st.push(n + 1); if (y > 0) st.push(n - W); if (y < H - 1) st.push(n + W);
  }
}

// ================= 設定 =================
async function set(){
  const s = await api('adminSettings'); SITE = s.site;
  const pct = s.quota ? Math.min(100, Math.round(s.used / s.quota * 100)) : 100;
  $('#main').innerHTML = `<h2>⚙️ 設定</h2>
  <div class="card">
    <b>🎨 每月生圖上限</b>
    <div class="row" style="margin:10px 0"><div class="quota" style="flex:1"><i style="width:${pct}%;background:${pct>=90?'var(--coral)':'var(--mint)'}"></i></div><b>${s.used} / ${s.quota}</b></div>
    <p class="sub">每隻寵物最多 4 張（幼年、青年、壯年、老年），每張約 US$0.04。到上限後寵物還是會孵化，只是先用預設圖，下個月 1 號自動恢復，玩家下次打卡會補畫。</p>
    <label class="f">每月最多幾張</label><div class="row"><input id="quota" type="number" min="0" value="${s.quota}" style="width:140px"><span class="sub">≈ 每月最多 US$${(s.quota*0.04).toFixed(1)}</span></div>
  </div>
  <div class="card">
    <b>🤖 Gemini</b>
    <p class="sub">金鑰狀態：${s.hasKey?'✅ 已設定（在指令碼屬性 GEMINI_KEY）':'❌ 還沒設定：到 Apps Script「專案設定 → 指令碼屬性」新增 GEMINI_KEY'}</p>
    <label class="f">文字模型</label><input id="tm" value="${esc(s.textModel)}" style="width:100%">
    <label class="f">生圖模型</label><input id="im" value="${esc(s.imgModel)}" style="width:100%">
    <p class="sub">Google 換新模型時，把名稱改成新的就好（例如 gemini-3.1-flash-image-preview）。</p>
    <button id="test" ${s.hasKey?'':'disabled'}>測試金鑰</button> <span id="tres" class="sub"></span>
  </div>
  <div class="card">
    <b>🌐 前台網址</b>
    <label class="f">GitHub Pages 網址</label><input id="site" value="${esc(s.site)}" placeholder="https://你的帳號.github.io/qiaotun/" style="width:100%">
    <p class="sub">用來在「動作圖」顯示原本的插圖。</p>
  </div>
  <button class="y" id="save" style="width:100%;padding:12px">儲存設定</button>`;
  $('#test').onclick=async()=>{$('#tres').textContent='測試中…';try{$('#tres').textContent='✅ '+await api('adminTestKey')}catch(e){$('#tres').textContent='❌ '+(e.message||e)}};
  $('#save').onclick=async()=>{await api('adminSaveSettings',{quota:$('#quota').value,textModel:$('#tm').value,imgModel:$('#im').value,site:$('#site').value});toast('已儲存');set()};
}

if (TOK) { show(true); tab('ov'); }
</script>
